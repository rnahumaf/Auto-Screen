<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>Controles de gravação</title>
  <link rel="stylesheet" href="./toolbar.css">
</head>
<body>
  <div class="toolbar">
    <div class="drag-area">
      <span id="statusDot" class="status-dot"></span>
      <div class="status-copy">
        <strong id="statusText">Gravando</strong>
        <span id="timer">00:00</span>
      </div>
    </div>
    <div class="controls">
      <button id="pauseButton" type="button">Pausar</button>
      <button id="stopButton" class="stop-button" type="button">Parar</button>
    </div>
  </div>
  <script type="module" src="./toolbar.js"></script>
</body>
</html>
