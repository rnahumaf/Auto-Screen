name: Publicar instalador Windows

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - name: Instalar dependências do núcleo
        run: npm ci
      - name: Instalar dependências do desktop
        run: npm ci --prefix apps/desktop
      - name: Instalar FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Validar projeto
        run: |
          npm run check
          npm run pack:check
      - name: Gerar instalador e versão portátil
        run: npm run desktop:dist
      - name: Gerar checksums SHA-256
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Publicar GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File |
            Where-Object { $_.Extension -eq ".exe" -or $_.Name -eq "SHA256SUMS.txt" } |
            ForEach-Object FullName
          gh release create "${{ github.ref_name }}" $assets --notes-file docs/RELEASE_NOTES.md --title "Auto-Screen ${{ github.ref_name }}"
